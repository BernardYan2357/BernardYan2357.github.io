site_name: Bernard's NoteBook
repo_url: https://github.com/BernardYan2357/BernardYan2357.github.io
repo_name: BernardYan2357.github.io
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - footnotes
  - toc:
      permalink: true
      slugify:
        object: pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.quotes:
      callouts: true
  - fenced_code
  - codehilite:
      guess_lang: false
      pygments_lang_class: true
  - pymdownx.highlight:
      use_pygments: true
      auto_title: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

theme:
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)" # 根据用户的系统设置自动切换主题
      scheme: default  # 使用默认的浅色主题
      primary: indigo # 设置主色调为靛蓝色
      accent: indigo
      toggle:
        icon: material/weather-night
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
  icon:
    repo: fontawesome/brands/github # 使用 Font Awesome 的 GitHub 图标
  features:
    - navigation.footer # 启用页脚导航
    - content.code.copy # 启用代码复制按钮
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BernardYan2357
copyright: "Copyright &copy; 2026 BernardYan2357. Build with Zensical."
