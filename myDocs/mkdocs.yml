site_name: MuYun's NoteBook
markdown_extensions:
  - tables
  - fenced_code
  - codehilite:
      guess_lang: false
      pygments_lang_class: true
  - pymdownx.highlight:
      use_pygments: true
      auto_title: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

theme:
  language: zh
  variant: classic
  features:
    - navigation.footer
    - content.code.copy
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BernardYan2357
copyright: "Copyright &copy; <year> <name>"
nav:
  - Home: index.md
  - 计算机视觉:
